<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoWallet • Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .balance {
            animation: countUp 2s ease-out forwards;
        }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
            50% { text-shadow: 0 0 40px rgba(34, 211, 238, 0.8); }
        }
        .token-row {
            opacity: 0;
            animation: slideIn 0.6s forwards;
        }
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 25s infinite linear;
        }
    </style>
</head>
<body class="bg-[#0a0a1f] text-white min-h-screen overflow-hidden relative">
    <!-- Animated Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="orb bg-cyan-400 w-96 h-96 -top-40 -left-40" style="animation-delay: 0s;"></div>
        <div class="orb bg-violet-500 w-[500px] h-[500px] top-1/3 right-0" style="animation-delay: -10s;"></div>
        <div class="orb bg-teal-400 w-80 h-80 bottom-0 left-1/4" style="animation-delay: -15s;"></div>
    </div>

    <div class="max-w-md mx-auto min-h-screen bg-[#0f0f2b] relative shadow-2xl overflow-hidden" style="box-shadow: 0 0 60px rgba(103, 232, 249, 0.1);">
        <!-- Header -->
        <div class="pt-8 px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-violet-500 rounded-2xl flex items-center justify-center text-xl font-bold">👾</div>
                <div>
                    <div class="text-sm text-gray-400">@CryptoWithSam</div>
                    <div class="font-semibold">Samuel Budiarti</div>
                </div>
            </div>
            <div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">👤</div>
        </div>

        <!-- Balance -->
        <div class="px-6 mt-8">
            <div class="text-sm text-gray-400 tracking-widest">TOTAL BALANCE</div>
            <div id="balance" class="title-font text-7xl font-bold tracking-tighter mt-1 balance" style="animation: pulse-glow 4s infinite alternate;">$58,742.35</div>
            <div class="flex items-center gap-2 mt-2">
                <div class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-sm font-medium rounded-3xl flex items-center gap-1">
                    <span class="text-lg">↑</span> +$1,284.22
                </div>
                <div class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-sm font-medium rounded-3xl">+2.23%</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-4 gap-3 px-6 mt-10">
            <button onclick="handleAction('add')" class="glass aspect-square rounded-3xl flex flex-col items-center justify-center hover:scale-110 transition-all active:scale-95 group">
                <div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-2xl flex items-center justify-center text-3xl mb-2 group-active:scale-90 transition-transform">+</div>
                <span class="text-xs font-medium">Add</span>
            </button>
            <button onclick="handleAction('transfer')" class="glass aspect-square rounded-3xl flex flex-col items-center justify-center hover:scale-110 transition-all active:scale-95 group">
                <div class="w-12 h-12 bg-gradient-to-br from-violet-400 to-purple-500 rounded-2xl flex items-center justify-center text-3xl mb-2 group-active:scale-90 transition-transform">↗</div>
                <span class="text-xs font-medium">Send</span>
            </button>
            <button onclick="handleAction('exchange')" class="glass aspect-square rounded-3xl flex flex-col items-center justify-center hover:scale-110 transition-all active:scale-95 group">
                <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center text-3xl mb-2 group-active:scale-90 transition-transform">⇄</div>
                <span class="text-xs font-medium">Swap</span>
            </button>
            <button onclick="handleAction('buy')" class="glass aspect-square rounded-3xl flex flex-col items-center justify-center hover:scale-110 transition-all active:scale-95 group">
                <div class="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl flex items-center justify-center text-3xl mb-2 group-active:scale-90 transition-transform">💎</div>
                <span class="text-xs font-medium">Buy</span>
            </button>
        </div>

        <!-- Search -->
        <div class="px-6 mt-8">
            <div class="glass rounded-3xl px-5 py-4 flex items-center gap-3 focus-within:ring-2 focus-within:ring-cyan-400/50 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input id="search" type="text" placeholder="Search tokens or discover new assets" class="bg-transparent outline-none flex-1 text-sm placeholder-gray-400">
            </div>
        </div>

        <!-- Trending Tokens -->
        <div class="mt-8 px-6">
            <div class="flex justify-between items-center mb-4">
                <div class="font-semibold text-lg">My Portfolio</div>
                <div class="text-xs bg-white/10 px-3 py-1 rounded-full">Today</div>
            </div>

            <div id="token-list" class="space-y-3"></div>
        </div>

        <!-- Bottom Nav -->
        <div class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full bg-[#0f0f2b]/90 backdrop-blur-xl border-t border-white/10 py-3 px-8">
            <div class="flex justify-between text-xs">
                <div class="flex flex-col items-center text-cyan-400">
                    <div class="text-2xl mb-1">🏠</div>
                    <div>Home</div>
                </div>
                <div class="flex flex-col items-center opacity-60">
                    <div class="text-2xl mb-1">📊</div>
                    <div>Market</div>
                </div>
                <div class="flex flex-col items-center opacity-60">
                    <div class="text-2xl mb-1">💱</div>
                    <div>Trade</div>
                </div>
                <div class="flex flex-col items-center opacity-60">
                    <div class="text-2xl mb-1">👛</div>
                    <div>Wallet</div>
                </div>
                <div class="flex flex-col items-center opacity-60">
                    <div class="text-2xl mb-1">⚙️</div>
                    <div>More</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Token Data
        const tokens = [
            {
                icon: '⟠',
                name: 'Ethereum',
                symbol: 'ETH',
                amount: '0.01923',
                value: '3742.18',
                change: '+2.18'
            },
            {
                icon: '$',
                name: 'USDC',
                symbol: 'USDC',
                amount: '4873.2',
                value: '4873.20',
                change: '-0.09'
            },
            {
                icon: '◎',
                name: 'Solana',
                symbol: 'SOL',
                amount: '32.84',
                value: '613.45',
                change: '+0.45'
            },
            {
                icon: '₿',
                name: 'Bitcoin',
                symbol: 'BTC',
                amount: '0.0421',
                value: '4128.67',
                change: '+1.67'
            },
            {
                icon: 'S',
                name: 'Sui',
                symbol: 'SUI',
                amount: '1245.8',
                value: '1845.92',
                change: '-0.34'
            }
        ];

        function createTokenRow(token) {
            const isPositive = parseFloat(token.change) > 0;
            const row = document.createElement('div');
            row.className = `token-row glass rounded-3xl p-4 flex items-center justify-between hover:scale-[1.02] transition-all cursor-pointer`;
            row.style.animationDelay = `${tokens.indexOf(token) * 100}ms`;
            row.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-white/10 to-white/5 rounded-2xl flex items-center justify-center text-3xl">${token.icon}</div>
                    <div>
                        <div class="font-semibold">${token.name}</div>
                        <div class="text-sm text-gray-400">${token.amount} ${token.symbol}</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="font-mono font-semibold">$${parseFloat(token.value).toLocaleString()}</div>
                    <div class="text-sm ${isPositive ? 'text-emerald-400' : 'text-red-400'}">
                        ${isPositive ? '↑' : '↓'} ${token.change}%
                    </div>
                </div>
            `;
            return row;
        }

        // Render Tokens
        function renderTokens() {
            const container = document.getElementById('token-list');
            container.innerHTML = '';
            tokens.forEach(token => {
                container.appendChild(createTokenRow(token));
            });
        }

        // Count Up Animation for Balance
        function animateBalance() {
            const balanceEl = document.getElementById('balance');
            const target = 58742.35;
            let current = 0;
            const increment = target / 60;
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                balanceEl.textContent = '$' + current.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }, 30);
        }

        function handleAction(action) {
            const messages = {
                'add': 'Opening funding options...',
                'transfer': 'Preparing transfer...',
                'exchange': 'Opening swap interface...',
                'buy': 'Loading buy options...'
            };
            alert(messages[action] || 'Action triggered!');
        }

        // Initialize
        window.onload = () => {
            renderTokens();
            animateBalance();

            // Search functionality
            const searchInput = document.getElementById('search');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('.token-row');
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(term) ? 'flex' : 'none';
                });
            });
        };
    </script>
</body>
</html>
